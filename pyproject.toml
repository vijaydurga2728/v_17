[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "v17"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "structlog>=24.1",
  "httpx>=0.27",
  "python-dateutil>=2.9",
  "smartmoneyconcepts>=0.0.26",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "matplotlib>=3.9",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
# Cycle 9 (ADR 001 G: XNYS calendar pinned, no fallback). numba is optional:
# c9 core has a pure-Python path with identical results (6 ms vs 56 ms per MCPT perm).
c9 = [
  "pandas_market_calendars==5.6.1",
  "numba==0.67.0",
  "llvmlite==0.49.0",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-benchmark>=4.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
  "types-python-dateutil>=2.9",
]

[project.scripts]
v17 = "v17.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/v17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "integration: hits real data on disk",
    "perf: wall-clock performance guards (opt-in via -m perf)",
]
